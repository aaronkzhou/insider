name: Refresh SEC insider data

on:
  schedule:
    # 12:00 UTC ≈ 8am ET / 5am PT. Form 4s must be filed within 2 business
    # days of a transaction, so once a day is enough to stay current.
    - cron: "0 12 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      # Every real government data source used here has failed transiently
      # in practice (SEC 503s, oge.gov connection timeouts, etc.) — wrap
      # every fetch in scripts/with-retry.sh so a blip doesn't fail the whole
      # day's refresh. It retries up to 3 times with a growing delay, then
      # fails the step for real if the source genuinely isn't reachable.
      - name: Fetch latest SEC Form 4 data (tracked companies)
        run: bash scripts/with-retry.sh npm run fetch:sec

      - name: Refresh individually-tracked people (real Form 4 filers)
        run: |
          bash scripts/with-retry.sh node scripts/add-person.mjs "Donald Trump Jr." 2016181
          bash scripts/with-retry.sh node scripts/add-person.mjs "Donald J. Trump" 947033
          bash scripts/with-retry.sh node scripts/add-person.mjs "Musk Elon" 1494730
          bash scripts/with-retry.sh node scripts/add-person.mjs "JD Vance" 1834682
          bash scripts/with-retry.sh node scripts/add-person.mjs "Situational Awareness LP" 2045724

      - name: Refresh fund portfolios (real 13F filers)
        run: |
          bash scripts/with-retry.sh node scripts/add-fund.mjs "Situational Awareness LP" 2045724
          # Thiel personally holds PLTR via Form 4 (fetched above via the
          # tracked-company step) and separately controls this fund — merge
          # onto his existing page instead of creating a second disconnected one.
          bash scripts/with-retry.sh node scripts/add-fund.mjs "Thiel Macro LLC" 1562087 --person-id=thiel-peter-1060

      - name: Refresh beneficial-ownership disclosures (real Schedule 13D/13G filers)
        run: bash scripts/with-retry.sh node scripts/add-beneficial-ownership.mjs

      - name: Refresh congressional disclosures (real STOCK Act PTRs)
        run: |
          YEAR=$(date -u +%Y)
          LAST_YEAR=$((YEAR - 1))
          bash scripts/with-retry.sh node scripts/add-congress-member.mjs "Pelosi" "Nancy" "$LAST_YEAR" "$YEAR" --spouse="Paul Pelosi"
          # Annual Financial Disclosure Reports (the real asset/holdings
          # schedule, filed once a year) land in the PRIOR calendar year's
          # zip. Safe to re-run daily — it's a no-op once nothing new is filed.
          bash scripts/with-retry.sh node scripts/add-congress-annual-disclosure.mjs "Pelosi" "Nancy" "$LAST_YEAR"

      - name: Scan the market-wide firehose for untracked-stock clusters
        run: bash scripts/with-retry.sh node scripts/scan-market-clusters.mjs

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- src/data/generated; then
            echo "No data changes."
            exit 0
          fi
          git add src/data/generated
          git commit -m "chore: refresh SEC insider data ($(date -u +%Y-%m-%d))"
          git push
