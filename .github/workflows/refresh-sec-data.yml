name: Refresh SEC insider data

on:
  schedule:
    # 12:00 UTC ≈ 8am ET / 5am PT. Form 4s must be filed within 2 business
    # days of a transaction, so once a day is enough to stay current.
    - cron: "0 12 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Fetch latest SEC Form 4 data (tracked companies)
        run: npm run fetch:sec

      - name: Refresh individually-tracked people (real Form 4 filers)
        run: |
          node scripts/add-person.mjs "Donald Trump Jr." 2016181
          node scripts/add-person.mjs "Donald J. Trump" 947033
          node scripts/add-person.mjs "Musk Elon" 1494730
          node scripts/add-person.mjs "JD Vance" 1834682

      - name: Refresh fund portfolios (real 13F filers)
        run: |
          node scripts/add-fund.mjs "Situational Awareness LP" 2045724
          # Thiel personally holds PLTR via Form 4 (fetched above via the
          # tracked-company step) and separately controls this fund — merge
          # onto his existing page instead of creating a second disconnected one.
          node scripts/add-fund.mjs "Thiel Macro LLC" 1562087 --person-id=thiel-peter-1060

      - name: Refresh congressional disclosures (real STOCK Act PTRs)
        run: |
          YEAR=$(date -u +%Y)
          LAST_YEAR=$((YEAR - 1))
          node scripts/add-congress-member.mjs "Pelosi" "Nancy" "$LAST_YEAR" "$YEAR" --spouse="Paul Pelosi"

      - name: Scan the market-wide firehose for untracked-stock clusters
        run: node scripts/scan-market-clusters.mjs

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- src/data/generated; then
            echo "No data changes."
            exit 0
          fi
          git add src/data/generated
          git commit -m "chore: refresh SEC insider data ($(date -u +%Y-%m-%d))"
          git push
